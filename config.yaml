server:
  host: "0.0.0.0"
  port: 8080
  workers: 200              # large pool — tunnels now use separate threads

logging:
  level: "INFO"
  log_file: proxy.log
  max_bytes: 10485760
  backup_count: 5

cache:
  enabled: true
  max_size: 512
  ttl: 300

bandwidth:
  enabled: true
  default_kbps: 0
  per_ip: {}

ip_filter:
  mode: "none"
  list: []

# Block IPv6 connectivity check hosts that always fail and cause delays
domain_filter:
  mode: "blocklist"
  list:
    - "ipv6.msftncsi.com"
    - "ipv6.msftconnecttest.com"
    - "teredo.ipv6.microsoft.com"